<!DOCTYPE html>
<html>
<head>
    <title>{{ title }}</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<div class="mb-4">
    <a href="/dashboard-ui" class="btn btn-dark">Dashboard</a>
    <a href="/users-ui" class="btn btn-outline-primary">Users</a>
    <a href="/campaigns-ui" class="btn btn-outline-success">Campaigns</a>
    <a href="/campaigns-create-ui" class="btn btn-outline-warning">Create Campaign</a>
    <a href="/campaign-logs-ui" class="btn btn-outline-info">Campaign Logs</a>
    <a href="/logout-ui" class="btn btn-outline-danger">Logout</a>
</div>
<body>

<div class="container mt-5">

    <a href="/campaigns-ui" class="btn btn-secondary mb-3">Back to Campaigns</a>

    <h1 class="mb-4">Create Campaign</h1>

    <div class="card">
        <div class="card-body">

            <form method="post" action="/campaigns-create-ui">

                <div class="mb-3">
                    <label class="form-label">Campaign Title</label>
                    <input type="text" name="title" class="form-control" required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Message</label>
                    <textarea name="message" class="form-control" required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Target Segment</label>
                    <select name="target_segment" class="form-control" required>
                        <option value="inactive_7_days">Inactive 7 Days</option>
                        <option value="inactive_30_days">Inactive 30 Days</option>
                        <option value="active_subscribers">Active Subscribers</option>
                        <option value="expired_subscribers">Expired Subscribers</option>
                        <option value="unfinished_watchers">Unfinished Watchers</option>
                        <option value="thriller_lovers">Thriller Lovers</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Channel</label>
                    <select name="channel" class="form-control" required>
                        <option value="push">Push</option>
                        <option value="email">Email</option>
                        <option value="sms">SMS</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select name="status" class="form-control" required>
                        <option value="active">Active</option>
                        <option value="draft">Draft</option>
                        <option value="completed">Completed</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    Create Campaign
                </button>

            </form>

        </div>
    </div>

</div>

</body>
</html>
